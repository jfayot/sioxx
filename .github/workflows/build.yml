name: Build

on:
  workflow_call:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            runner: ubuntu-latest
            architecture: x64
            compiler: gcc
            cmake_arguments: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          - name: Linux / Clang
            runner: ubuntu-latest
            architecture: x64
            compiler: clang
            cmake_arguments: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          - name: macOS / Clang
            runner: macos-latest
            architecture: x64
            compiler: clang
            cmake_arguments: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          - name: Windows / x64
            runner: windows-latest
            architecture: x64
            compiler: msvc
            cmake_arguments: -A x64
          - name: Windows / ARM64
            runner: windows-11-arm
            architecture: ARM64
            compiler: msvc
            cmake_arguments: -A ARM64

    steps:
      - uses: actions/checkout@v6

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent
          key: fetchcontent-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.compiler }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/SioxxBuildHelpers.cmake', 'tests/CMakeLists.txt') }}

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          "-DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.cache/fetchcontent"
          ${{ matrix.cmake_arguments }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
