name: CMake Integration

on:
  workflow_call:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cmake-integration.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "tests/integration/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/cmake-integration.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "include/**"
      - "src/**"
      - "tests/integration/**"

permissions:
  contents: read

concurrency:
  group: cmake-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cmake-integration:
    name: Install and subproject
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent
          key: fetchcontent-v1-${{ runner.os }}-${{ runner.arch }}-gcc-ninja-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/SioxxBuildHelpers.cmake', 'tests/CMakeLists.txt') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libssl-dev \
            ninja-build

      - name: Build and install with fetched dependencies
        run: cmake --workflow --preset ci-fetched-static --fresh

      - name: Consume installed static library
        working-directory: tests/integration/consumer
        run: |
          mv ../../../stage ../../../relocated-stage
          cmake --workflow --preset ci-fetched-static --fresh

      - name: Build and install shared library with fetched dependencies
        run: cmake --workflow --preset ci-fetched-shared --fresh

      - name: Consume fetched-dependency shared library
        working-directory: tests/integration/consumer
        run: |
          mv ../../../stage-fetched-shared ../../../relocated-stage-fetched-shared
          cmake --workflow --preset ci-fetched-shared --fresh

      - name: Consume sioxx with minimum FetchContent dependencies
        working-directory: tests/integration/subproject
        run: |
          cmake --workflow --preset ci-subproject --fresh
          if cmake --build ../../../build-subproject --target install; then
            echo "Subproject unexpectedly generated an install target" >&2
            exit 1
          fi

  cmake-system-integration:
    name: System dependencies
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: brew install boost ninja nlohmann-json openssl

      - name: Build and install static library with system dependencies
        run: cmake --workflow --preset ci-system-static --fresh

      - name: Consume installed system-dependency static library
        working-directory: tests/integration/consumer
        run: cmake --workflow --preset ci-system-static --fresh

      - name: Build and install shared library with system dependencies
        run: cmake --workflow --preset ci-system-shared --fresh

      - name: Consume installed shared library
        working-directory: tests/integration/consumer
        run: cmake --workflow --preset ci-system-shared --fresh

  cmake-windows-integration:
    name: Windows installed package
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent
          key: fetchcontent-v1-${{ runner.os }}-${{ runner.arch }}-msvc-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/SioxxBuildHelpers.cmake', 'tests/CMakeLists.txt') }}

      - name: Build and install
        run: cmake --workflow --preset ci-windows-fetched-static --fresh

      - name: Consume installed package
        working-directory: tests/integration/consumer
        run: cmake --workflow --preset ci-windows-fetched-static --fresh

      - name: Read runner image version
        id: runner-image
        run: '"version=$env:ImageVersion" >> $env:GITHUB_OUTPUT'

      - name: Cache vcpkg packages and downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/vcpkg
            ${{ github.workspace }}/.cache/vcpkg-downloads
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-x64-windows-${{ steps.runner-image.outputs.version }}-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-x64-windows-

      - name: Install system dependencies with vcpkg
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.cache/vcpkg,readwrite
          VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg-downloads
        run: |
          New-Item -ItemType Directory -Force "${{ github.workspace }}/.cache/vcpkg" | Out-Null
          New-Item -ItemType Directory -Force "${{ github.workspace }}/.cache/vcpkg-downloads" | Out-Null
          vcpkg install `
            boost-asio `
            boost-beast `
            nlohmann-json `
            openssl `
            --triplet x64-windows

      - name: Build and install system-dependency shared library
        run: cmake --workflow --preset ci-windows-system-shared --fresh

      - name: Consume system-dependency shared package
        working-directory: tests/integration/consumer
        run: cmake --workflow --preset ci-windows-system-shared --fresh
