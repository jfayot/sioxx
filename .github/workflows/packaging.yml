name: Packaging

on:
  workflow_call:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/packaging.yml"
      - "CMakeLists.txt"
      - "LICENSE"
      - "cmake/**"
      - "conanfile.py"
      - "include/**"
      - "src/**"
      - "tests/packaging/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/packaging.yml"
      - "CMakeLists.txt"
      - "LICENSE"
      - "cmake/**"
      - "conanfile.py"
      - "include/**"
      - "src/**"
      - "tests/packaging/**"

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conan:
    name: Conan package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Conan
        run: python -m pip install "conan>=2.28,<3"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('conanfile.py', 'tests/packaging/conan/**') }}

      - name: Create and test Conan package
        run: |
          conan profile detect --force
          conan create . --test-folder tests/packaging/conan --build=missing
          conan create . \
            --test-folder tests/packaging/conan \
            -o "sioxx/*:shared=True" \
            --build=missing
