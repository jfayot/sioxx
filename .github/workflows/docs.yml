name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "include/**"
      - "docs/**"
      - "cmake/FindSphinx.cmake"
      - "cmake/SioxxBuildHelpers.cmake"
      - "CMakeLists.txt"
      - ".github/workflows/docs.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent
          key: fetchcontent-docs-${{ runner.os }}-${{ hashFiles('cmake/SioxxBuildHelpers.cmake') }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            doxygen \
            graphviz \
            libssl-dev

      - name: Install Sphinx dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_BASE_DIR="$PWD/.cache/fetchcontent" \
            -DSIOXX_BUILD_DOCS=ON \
            -DSIOXX_BUILD_TESTS=OFF \
            -DSIOXX_BUILD_EXAMPLES=OFF

      - name: Build documentation
        run: cmake --build build --target Sphinx --parallel

      - name: Verify generated site
        run: test -f build/docs/sphinx/index.html

      - name: Disable Jekyll processing
        run: touch build/docs/sphinx/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs/sphinx

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
