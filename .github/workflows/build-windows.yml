name: Build Windows

on:
  workflow_call:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: x64
          - runner: windows-11-arm
            architecture: ARM64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/fetchcontent
          key: fetchcontent-build-${{ runner.os }}-${{ runner.arch }}-msvc-${{ hashFiles('cmake/SioxxBuildHelpers.cmake', 'tests/CMakeLists.txt') }}

      - name: Configure CMake
        run: >
          cmake -B build
          -A ${{ matrix.architecture }}
          "-DFETCHCONTENT_BASE_DIR=${{ github.workspace }}/.cache/fetchcontent"
          -S .

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
